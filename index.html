<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- LEFT SIDE -->
        <section class="left-section">

            <div class="logo">
                f
            </div>

            <div class="left-content">

                <div class="text">
                    <span>Explore</span>
                    <span>the</span>
                    <span>things</span>
                    <span class="blue">you love<span class="black">.</span></span>
                </div>

                <div class="visual">

                    <div class="emoji">😂</div>

                    <div class="main-card">
                        <div class="person"></div>
                    </div>

                    <div class="small-card">
                        <div class="fake-image"></div>
                        <div class="line"></div>
                        <div class="line short"></div>
                    </div>

                    <div class="heart">♥</div>

                </div>

            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="right-section">

            <div class="login-container">

                <h1>Log in to Facebook</h1>

                <!-- UI MOCKUP: does not submit credentials -->
                <form onsubmit="return false;">

                    <input
                        type="text"
                        placeholder="Email address or mobile number"
                    >

                    <input
                        type="password"
                        placeholder="Password"
                    >

                    <button class="login-btn" type="button" onclick="window.location.href='dashboard.html'">
                        Log in
                    </button>

                    <a href="#" class="forgot">
                        Forgotten password?
                    </a>

                    <a class="create-btn" href="signup.html">
                        Create new account
                    </a>

                </form>

                <div class="meta">
                    <span class="meta-symbol">∞</span>
                    Meta
                </div>

            </div>

        </section>

    </main>

</body>
</html>
